[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contagion-quarantine-optimizer"
version = "0.1.0"
description = "Budget-constrained quarantine optimisation for false-claim contagion in multi-agent networks: per-node reproduction numbers from claim genealogies, sequential R_i-guided muting, scored by regret against an exhaustive-search oracle."
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
